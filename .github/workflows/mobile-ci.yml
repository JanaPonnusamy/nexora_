name: Mobile CI

# Gates every change to the Flutter app. Generated sources (*.g.dart,
# *.freezed.dart) are gitignored, so build_runner must run before analyze or
# test — without it the tree does not even compile.

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the version used for local development. Bump deliberately.
  FLUTTER_VERSION: '3.44.1'

defaults:
  run:
    working-directory: mobile

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Release readiness checks
        run: dart run tool/verify_release_readiness.dart

      - name: Test
        run: flutter test --reporter compact

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # The signing config reads a keystore from AXYTHIC_KEYSTORE_* (see
      # android/key.properties.example). Until those secrets exist this job can
      # only prove the Android target compiles, so it builds debug. Add the
      # secrets and it upgrades itself to a signed release build with no edit
      # here — and AXYTHIC_REQUIRE_RELEASE_SIGNING makes a missing or malformed
      # keystore fail the build rather than fall back to debug keys. A signed
      # artifact also requires an explicit HTTPS production URL; otherwise the
      # app would compile with the development HTTP default that release blocks.
      - name: Decode keystore
        if: ${{ secrets.AXYTHIC_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.AXYTHIC_KEYSTORE_BASE64 }}" | base64 -d \
            > "$RUNNER_TEMP/axythic-upload.jks"
          echo "AXYTHIC_KEYSTORE_PATH=$RUNNER_TEMP/axythic-upload.jks" >> "$GITHUB_ENV"

      - name: Validate signed release inputs
        if: ${{ secrets.AXYTHIC_KEYSTORE_BASE64 != '' }}
        env:
          AXYTHIC_API_BASE_URL: ${{ secrets.AXYTHIC_API_BASE_URL }}
        run: |
          case "$AXYTHIC_API_BASE_URL" in
            https://*) ;;
            *)
              echo "::error::AXYTHIC_API_BASE_URL must be a non-empty HTTPS URL."
              exit 1
              ;;
          esac

      - name: Build AAB (release, signed)
        if: ${{ secrets.AXYTHIC_KEYSTORE_BASE64 != '' }}
        env:
          AXYTHIC_REQUIRE_RELEASE_SIGNING: 'true'
          AXYTHIC_KEYSTORE_PASSWORD: ${{ secrets.AXYTHIC_KEYSTORE_PASSWORD }}
          AXYTHIC_KEY_ALIAS: ${{ secrets.AXYTHIC_KEY_ALIAS }}
          AXYTHIC_KEY_PASSWORD: ${{ secrets.AXYTHIC_KEY_PASSWORD }}
          AXYTHIC_API_BASE_URL: ${{ secrets.AXYTHIC_API_BASE_URL }}
        run: >-
          flutter build appbundle --release
          --dart-define=NEXORA_ENV=prod
          --dart-define=NEXORA_API_BASE_URL="$AXYTHIC_API_BASE_URL"

      - name: Build APK (debug, unsigned)
        if: ${{ secrets.AXYTHIC_KEYSTORE_BASE64 == '' }}
        run: flutter build apk --debug

      - name: Upload signed app bundle
        if: ${{ secrets.AXYTHIC_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Upload debug APK
        if: ${{ secrets.AXYTHIC_KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 40
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # --no-codesign: this job proves the iOS target compiles. Signed archives
      # require the Apple certificates, which are a release-pipeline concern.
      - name: Build iOS (no codesign)
        run: flutter build ios --debug --no-codesign

      # `flutter test` only collects test/, so integration_test/ needs its own
      # invocation against a booted simulator.
      - name: Boot a simulator
        run: |
          device=$(xcrun simctl list devices available \
            | grep -oE 'iPhone 1[5-9][^(]*\([A-F0-9-]{36}\)' \
            | head -1 | grep -oE '[A-F0-9-]{36}')
          if [ -z "$device" ]; then
            echo "::error::No iPhone simulator available on this runner."
            exit 1
          fi
          echo "SIM_UDID=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b

      - name: Integration tests
        run: flutter test integration_test -d "$SIM_UDID"

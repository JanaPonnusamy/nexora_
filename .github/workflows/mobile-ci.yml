name: Mobile CI

# Gates every change to the Flutter app. Generated sources (*.g.dart,
# *.freezed.dart) are gitignored, so build_runner must run before analyze or
# test — without it the tree does not even compile.

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the version used for local development. Bump deliberately.
  FLUTTER_VERSION: '3.44.1'

defaults:
  run:
    working-directory: mobile

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter compact

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # Debug, not release: release signing needs a keystore that is not yet
      # provisioned. Swap to `--release` once the signing config lands.
      - name: Build APK (debug)
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 40
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # --no-codesign: this job proves the iOS target compiles. Signed archives
      # require the Apple certificates, which are a release-pipeline concern.
      - name: Build iOS (no codesign)
        run: flutter build ios --debug --no-codesign

      # `flutter test` only collects test/, so integration_test/ needs its own
      # invocation against a booted simulator.
      - name: Boot a simulator
        run: |
          device=$(xcrun simctl list devices available \
            | grep -oE 'iPhone 1[5-9][^(]*\([A-F0-9-]{36}\)' \
            | head -1 | grep -oE '[A-F0-9-]{36}')
          if [ -z "$device" ]; then
            echo "::error::No iPhone simulator available on this runner."
            exit 1
          fi
          echo "SIM_UDID=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b

      - name: Integration tests
        run: flutter test integration_test -d "$SIM_UDID"

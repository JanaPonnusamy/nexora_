<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285 88" fill="none">
  <defs>
    <!-- Left face: deep blue gradient -->
    <linearGradient id="alBlue" x1="39" y1="4" x2="3" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#42B4F5"/>
      <stop offset="45%"  stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#0D3A8A"/>
    </linearGradient>

    <!-- Center-right face: cyan → purple → magenta → orange -->
    <linearGradient id="alRainbow" x1="39" y1="4" x2="73" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00D4E8"/>
      <stop offset="28%"  stop-color="#8B3FD9"/>
      <stop offset="62%"  stop-color="#E82070"/>
      <stop offset="100%" stop-color="#FF6010"/>
    </linearGradient>

    <!-- Right metallic edge: silver-blue -->
    <linearGradient id="alSilver" x1="52" y1="4" x2="75" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#A8D4F0"/>
      <stop offset="60%"  stop-color="#7FA8C8"/>
      <stop offset="100%" stop-color="#4D7490"/>
    </linearGradient>

    <!-- Apex highlight -->
    <radialGradient id="alApex" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Reflection fade mask -->
    <linearGradient id="alReflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="white" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="reflectMaskLockup">
      <rect x="0" y="0" width="78" height="18" fill="url(#alReflect)"/>
    </mask>

    <!-- Wordmark gradient: cyan → blue → indigo -->
    <linearGradient id="alWord" x1="92" y1="20" x2="275" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Emblem Reflection -->
  <g transform="translate(0, 172) scale(1, -1)" mask="url(#reflectMaskLockup)">
    <polygon fill="url(#alBlue)"    points="39,4 3,84 21,84 39,57"/>
    <polygon fill="url(#alRainbow)" points="39,4 52,4 73,84 57,84 39,57"/>
    <polygon fill="url(#alSilver)"  points="52,4 55,4 75,84 73,84"/>
  </g>

  <!-- Emblem Main -->
  <polygon fill="url(#alBlue)" points="39,4 3,84 21,84 39,57"/>
  <polygon fill="url(#alRainbow)" points="39,4 52,4 73,84 57,84 39,57"/>
  <polygon fill="url(#alSilver)" points="52,4 55,4 75,84 73,84"/>
  <ellipse cx="44" cy="11" rx="9" ry="6" fill="url(#alApex)" transform="rotate(-18, 44, 11)"/>

  <!-- Wordmark Text -->
  <text x="96" y="60" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="48" font-weight="700" letter-spacing="-1" fill="url(#alWord)">Axythic</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 96" role="img" aria-label="Axythic">
  <title>Axythic</title>
  <defs>
    <!-- Left leg: deep navy at the foot rising to a bright azure. -->
    <linearGradient id="ax-leg-left" x1="0.15" y1="1" x2="0.75" y2="0">
      <stop offset="0%" stop-color="#1b3a8f"/>
      <stop offset="45%" stop-color="#2f5fd0"/>
      <stop offset="100%" stop-color="#5aa9f5"/>
    </linearGradient>

    <!-- Right leg: ember at the foot, through magenta, into blue at the apex. -->
    <linearGradient id="ax-leg-right" x1="0.85" y1="1" x2="0.3" y2="0">
      <stop offset="0%" stop-color="#f4622e"/>
      <stop offset="28%" stop-color="#e0402f"/>
      <stop offset="60%" stop-color="#a03aa8"/>
      <stop offset="100%" stop-color="#3f6fe0"/>
    </linearGradient>

    <!-- Crossbar bridges the two legs. -->
    <linearGradient id="ax-crossbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a55c4"/>
      <stop offset="100%" stop-color="#b13c96"/>
    </linearGradient>

    <!-- Cool highlight over the apex. -->
    <linearGradient id="ax-apex" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#b6e8ff"/>
      <stop offset="50%" stop-color="#74c8fb" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4b9ef0" stop-opacity="0"/>
    </linearGradient>

    <!-- Wordmark: cyan through to periwinkle, left to right. -->
    <linearGradient id="ax-word" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#49c3f5"/>
      <stop offset="45%" stop-color="#5aa6f5"/>
      <stop offset="100%" stop-color="#8b83ef"/>
    </linearGradient>
  </defs>

  <!-- ── Mark ─────────────────────────────────────────────────────
       Two legs sharing a 16-unit apex edge. Their inner edges cross at
       (50, 28), so the counter below that point is open canvas rather
       than a painted notch — the mark sits correctly on any ground.
  ────────────────────────────────────────────────────────────────── -->
  <path d="M42 8 L58 8 L26 88 L2 88 Z" fill="url(#ax-leg-left)"/>
  <path d="M42 8 L58 8 L98 88 L74 88 Z" fill="url(#ax-leg-right)"/>
  <path d="M36.4 62 L63.6 62 L70 78 L30 78 Z" fill="url(#ax-crossbar)"/>
  <path d="M42 8 L58 8 L54 40 L46 40 Z" fill="url(#ax-apex)"/>

  <!-- ── Wordmark ─────────────────────────────────────────────── -->
  <text x="118" y="66"
        font-family="'SF Pro Display', -apple-system, 'Segoe UI Variable Display', 'Segoe UI', Inter, Roboto, system-ui, sans-serif"
        font-size="52"
        font-weight="700"
        letter-spacing="-1.4"
        fill="url(#ax-word)">Axythic</text>
</svg>
